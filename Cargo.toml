[workspace]
resolver = "3"
members = ["crates/cocoa-core", "crates/cocoa-llm", "crates/cocoa-oauth", "crates/cocoa-quickjs", "crates/cocoa-tools", "crates/cocoa"]

[workspace.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
async-trait = "0.1.92"
base64 = "0.23.1"
clap = "4.6.7"
crossterm = { version = "0.29.0", default-features = false }
diffy = "0.5.2"
eventsource-stream = "0.2.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false }
httpdate = "1.0.3"
ignore = "0.4.34"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
miniz_oxide = "=0.9.1"
process-wrap = { version = "10.0.1", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
ratatui-textarea = { version = "0.9.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
roxmltree = { version = "0.21.2", default-features = false, features = ["std"] }
rquickjs = "0.14.0"
rquickjs-serde = "0.8.0"
rustix = { version = "1.1.6", default-features = false }
secrecy = "0.10.3"
serde = "1.0.229"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
semver = { version = "1.0.28", features = ["serde"] }
sha2 = { version = "0.11.1", default-features = false }
similar = "3.2.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
syntect = { version = "5.3.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
tui-markdown = { version = "0.3.13", default-features = false }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
url = "2.5.9"
wiremock = "0.6.5"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ezegros/cocoa"

[profile.dev]
codegen-units = 16
incremental = true
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
trivially_copy_pass_by_ref = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
