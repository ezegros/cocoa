[package]
name = "cocoa-tools"
description = "File, process, instruction, and skill capabilities for Cocoa agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
cocoa-core = { path = "../cocoa-core" }
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "fs", "process", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true, features = ["tokio1", "process-group"] }
rustix = { workspace = true, features = ["fs", "process"] }

[lints]
workspace = true
