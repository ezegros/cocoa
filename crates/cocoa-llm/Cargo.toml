[package]
name = "cocoa-llm"
description = "Model provider adapters for the Cocoa execution engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
cocoa-core = { path = "../cocoa-core" }
async-trait.workspace = true
eventsource-stream.workspace = true
futures-util = { workspace = true, features = ["std"] }
httpdate.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "stream", "http2"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
wiremock.workspace = true

[lints]
workspace = true
