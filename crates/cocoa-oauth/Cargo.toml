[package]
name = "cocoa-oauth"
description = "Browser OAuth and protected credential persistence for Cocoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "form", "stream"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "process", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
wiremock.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[lints]
workspace = true
